server {
    listen 80;
    server_name example.com www.example.com;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/sagd/staticfiles/;
    }

    location /media/ {
        alias /var/www/sagd/media/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/sagd.sock;
    }
}
