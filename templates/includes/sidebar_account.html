<div class="sidebar-footer sidebar-account-footer">
  <div class="account-summary">
    <div class="user-line">
      <div class="avatar account-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4.75 20c.55-3.36 3.16-5.5 7.25-5.5s6.7 2.14 7.25 5.5"/></svg>
        <span class="account-avatar-status"></span>
      </div>
      <div class="account-identity">
        <strong>{{ user.get_full_name|default:user.username }}</strong>
        <div class="user-role">{{ account_role|default:'Gestão de desempenho' }}</div>
      </div>
    </div>
    <span class="account-status"><i></i>Sessão ativa</span>
  </div>
  <form class="logout-form" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="logout" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"/></svg><span>Terminar sessão</span></button></form>
</div>
