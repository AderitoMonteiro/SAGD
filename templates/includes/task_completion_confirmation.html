<dialog id="task-completion-confirmation" class="objective-modal-card objective-delete-card" aria-labelledby="task-completion-title" aria-describedby="task-completion-message">
  <form method="dialog">
    <h2 id="task-completion-title">Concluir tarefa?</h2>
    <p id="task-completion-message" class="objective-modal-intro">Pretende marcar <strong data-completion-task-name>esta tarefa</strong> como concluída?</p>
    <div class="form-actions">
      <button class="button" value="cancel" autofocus>Cancelar</button>
      <button class="button primary" value="confirm">Confirmar conclusão</button>
    </div>
  </form>
</dialog>
